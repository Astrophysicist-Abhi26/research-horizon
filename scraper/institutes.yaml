    page: https://www.tifr.res.in/~daa/events_scheduled.html
    calendar: bsnfr66t6k67q6iefp9tf39c4g@group.calendar.google.com
    location: TIFR, Mumbai, India
    type: seminar
    checked: 2026-09-24

  - name: TIFR (Indico)
    kind: indico
    base: https://indico.tifr.res.in/indico
    category: 0
    location: TIFR, Mumbai, India
    insecure_ok: true
    enabled: false           # host unreachable from GitHub (connection refused), 2026-09-24

  - name: NCRA-TIFR (Indico)
    kind: indico
    base: https://conf1.ncra.tifr.res.in
    category: 0
    location: NCRA-TIFR, Pune, India
    insecure_ok: true

  # ── Institutes added from INSTITUTES.md (pure sciences first) ─────────
  # All checked from GitHub's network on 2026-10-25. Pages that list nothing
  # upcoming today were checked against their past items instead.

  - name: TIFR SciTalks (Indico)
    kind: indico
    base: https://scitalks.tifr.res.in
    category: 0
    location: TIFR, Mumbai, India
    exclude: "thesis defen[cs]e|synopsis|\\bviva\\b"
    checked: 2026-10-25       # all TIFR talks, conferences and workshops

  - name: TIFR (all-campus events)
    kind: listing
