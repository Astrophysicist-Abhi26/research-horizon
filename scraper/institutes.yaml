    category: 0
    location: NISER, Bhubaneswar, India
    checked: 2026-10-25

  - name: SINP (Indico)
    kind: indico
    base: https://indico.saha.ac.in
    category: 0
    location: SINP, Kolkata, India
    checked: 2026-10-25       # server works; nothing upcoming yet. www.saha.ac.in answers 500

  - name: IIT Bombay Mathematics seminars
    kind: ical                # the department's WebCalendar, published as iCal
    url: https://www.math.iitb.ac.in/webcal/publish.php?user=__public__
