  # public Google Calendars (embedded on physics.iisc.ac.in/calendar). Reading
  # them directly is the most reliable feed we have for the department,
  # including astronomy & astrophysics / JAP seminars.
  - name: IISc Physics (department calendars)
    kind: google_calendar
    page: https://physics.iisc.ac.in/calendar/
    location: Department of Physics, IISc, Bengaluru, India
    type: seminar
    calendars:
      - 8aed84e74907aabcb40f6871b800b277732757852c24de61eda8fc19f78278c5@group.calendar.google.com
      - physicscalender363@gmail.com
      - 6819ui7d1n49ijc0gos6rcncsc@group.calendar.google.com
      - 9rpn3pd81ji0e26i96hcj500vc@group.calendar.google.com
      - rouanbob03tutbjb5bnolrckk0@group.calendar.google.com
      - bq47n7a4ot2rmkjuii3rareao0@group.calendar.google.com
      - nd0ot57ipjnr537em6hqjc22uk@group.calendar.google.com
      - lcflldk4q1e2kpa9fit67or2to@group.calendar.google.com
      - 75ei4nftcipm6qe5ugklj6m8fk@group.calendar.google.com
    checked: 2026-09-24

  - name: IISc Physics (conferences)
    kind: listing
    url: https://physics.iisc.ac.in/events-all/conferences/
    location: Department of Physics, IISc, Bengaluru, India
    type: conference

  - name: IISc Physics (schools)
    kind: listing
    url: https://physics.iisc.ac.in/events-all/schools/
    location: Department of Physics, IISc, Bengaluru, India
    type: school

  - name: IISc (institute events)
    kind: listing
    url: https://www.iisc.ac.in/news-events/events-upcoming/
    location: IISc, Bengaluru, India
    href_filter: iisc\.ac\.in/events/
    checked: 2026-09-24

  - name: IISc Mathematics seminars
    kind: listing
    url: https://math.iisc.ac.in/SeminarsByYear/Seminars{year}.html
    location: Department of Mathematics, IISc, Bengaluru, India
    type: seminar

  # AI / ML side of IISc (WordPress "The Events Calendar" sites)
  - name: IISc EE events
    kind: wp_events
    base: https://ee.iisc.ac.in
    location: Department of Electrical Engineering, IISc, Bengaluru, India
    type: seminar
    enabled: false           # site returns a WordPress "Database Error" (HTTP 500) for its event
    checked: 2026-09-24      # feeds, and the calendar had 0 events even when it worked

  - name: IISc CSA events
    kind: wp_events
    base: https://www.csa.iisc.ac.in
    location: Department of Computer Science and Automation, IISc, Bengaluru, India
    type: seminar
    enabled: false           # not a "The Events Calendar" site (REST route 404); events are rendered by JavaScript
    checked: 2026-09-24

  - name: IISc CDS events
    kind: wp_events
    base: https://cds.iisc.ac.in
    location: Department of Computational and Data Sciences, IISc, Bengaluru, India
    type: seminar

  # ── RRI ──────────────────────────────────────────────────────────────
  # /events is the full talk list (astrophysics seminars, colloquia, special
  # lectures). v5 only read /events/colloquia, which had no upcoming items.
  - name: RRI talks
    kind: listing
    url: https://www.rri.res.in/events
    location: Raman Research Institute, Bengaluru, India
    href_filter: rri\.res\.in/events/[a-z0-9]+(?:-[a-z0-9]+){3,}$|^/events/[a-z0-9]+(?:-[a-z0-9]+){3,}$
    type: seminar
    checked: 2026-09-24

  - name: RRI meetings
    kind: listing
    url: https://www.rri.res.in/meetings
    location: Raman Research Institute, Bengaluru, India
    href_filter: /meetings/
    type: conference
    checked: 2026-09-24      # correct but often empty: nothing upcoming is announced yet

  # ── IIA ──────────────────────────────────────────────────────────────
  # All IIA talks and meetings live on its Indico server. Since 2026 its JSON
  # export needs an API key, so read the categories' public iCal feeds.
  # (The old www.iiap.res.in/upcoming_colloquium.php page is gone: 404.)
  - name: IIA seminars & colloquia
    kind: ical
    url: https://events.iiap.res.in/category/6/events.ics
    page: https://events.iiap.res.in/category/6/
    location: Indian Institute of Astrophysics, Bengaluru, India
    type: seminar
    insecure_ok: true        # server ships an incomplete TLS chain
    checked: 2026-09-24

  - name: IIA meetings & conferences
    kind: ical
    url: https://events.iiap.res.in/category/3/events.ics
    page: https://events.iiap.res.in/category/3/
    location: Indian Institute of Astrophysics, Bengaluru, India
    type: conference
    insecure_ok: true
    checked: 2026-09-24

  # ── JNCASR ───────────────────────────────────────────────────────────
  - name: JNCASR events
    kind: listing
    url: https://www.jncasr.ac.in/all-events
    location: JNCASR, Jakkur, Bengaluru, India
    href_filter: /all-events/[a-z0-9-]{12,}
    checked: 2026-09-24      # table with DD/MM/YYYY dates

  - name: JNCASR Theoretical Sciences Unit
    kind: listing
    url: https://www.jncasr.ac.in/research/research-units/theoretical-sciences-unit/events
    location: JNCASR, Jakkur, Bengaluru, India

  # ── Christ University ────────────────────────────────────────────────
  # No central events page: each meeting gets its own Google-Sites microsite
  # (cosmos.christuniversity.in, ram2026.christuniversity.in, ...) or only a
  # poster + Google Form (Neighbourhood Cosmology Meeting 4). IUCAA-sponsored
  # ones appear on IUCAA's "events outside IUCAA" page below; everything else
  # comes in through the watchlist or an "Add event" issue.

# ═══════════════════════════ REST OF INDIA ═══════════════════════════════

  - name: IUCAA (events outside IUCAA)
    kind: listing
