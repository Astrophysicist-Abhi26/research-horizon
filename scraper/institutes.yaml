# Event Horizon 2.0 — institute registry
#
# One entry = one source = one line in the site's "Source health" panel.
# Bengaluru first, then the rest of India. Global aggregators (INSPIRE, CADC,
# DESC, researchseminars.org, AI deadlines) live in sources.py and already
# cover many Indian conferences; this file is for what they miss.
#
# kind:
#   listing          an HTML page that lists upcoming events
#                    (generic extractor: keeps a link only if a date sits in the same block)
#   google_calendar  public Google Calendar(s), by calendar id  — most robust
#   ical             any public .ics feed                          — most robust
#   wp_events        WordPress "The Events Calendar" site (REST API, falls back to iCal)
#   indico           Indico server (JSON export, falls back to iCal)
#   rss              RSS feed whose item titles start with the date (Joomla JEvents)
#   table            an HTML table with a header row (Title / Speaker / Date / Venue ...);
#                    columns are recognised by their header words
#   labelled_list    <li> items with "Date:", "Time:", "Venue:" lines (CMI)
#   iiser_pune       IISER Pune's events search (its page is a JavaScript app)
#
# Other keys:
#   name, location (default location for the events), type (default event type),
#   url / urls (may contain {year}), href_filter (regex; only matching links are
#   candidates), insecure_ok (server ships a broken TLS chain: fetch anyway —
#   read-only public data), min_expected (health turns amber below this),
#   include / exclude (regex on the title: keep only / drop matching items, e.g.
#   a notice board's tenders, or thesis defences), title_in_description (the
#   calendar names an entry after its speaker; the real title is the "Title:"
#   line of its description),
#   enabled: false (parked; `python scraper/doctor.py --all` still tests it),
#   checked: when a human last confirmed the page layout.
#
# Test every entry against the live sites from your own machine with
#   python scraper/doctor.py            (add --all to include parked entries)

sources:

# ═══════════════════════════ BENGALURU ═══════════════════════════════════

  # ── ICTS ─────────────────────────────────────────────────────────────
  - name: ICTS Bengaluru
    kind: listing
    url: https://www.icts.res.in/programs/upcoming
    location: ICTS, Bengaluru, India
    href_filter: /(program|discussion-meeting|event|lectures|school|summer-course)/
    min_expected: 3
    checked: 2026-09-23

  - name: ICTS Bengaluru (events)
    kind: listing
    url: https://www.icts.res.in/current-and-upcoming-events
    location: ICTS, Bengaluru, India
    href_filter: /(program|discussion-meeting|event|lectures|school|summer-course)/
    checked: 2026-09-23

